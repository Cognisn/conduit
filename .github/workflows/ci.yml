name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      # Workstream branches of every kind: <kind>/<version>-<aspect>.
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "chore/**"
      - "test/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "style/**"
      - "security/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .

  types:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # torch first, from the PyTorch CPU index, so the local-embeddings extra keeps it
      # and no NVIDIA package is installed (C13, Q0029).
      - name: Install CPU-only torch
        run: pip install "torch>=2.15,<3" --index-url https://download.pytorch.org/whl/cpu
      # Every runtime extra, so mypy sees each layer's libraries (Q0008).
      - name: Install with every runtime extra
        shell: bash
        run: |
          pip install -e ".[dev]"
          extras=$(python -c "import importlib.metadata as m; print(','.join(e for e in m.metadata('cognisn-conduit').get_all('Provides-Extra') or [] if e != 'dev'))")
          pip install -e ".[dev,$extras]"
      - name: Refuse any NVIDIA package
        run: |
          if pip list --format=freeze | grep -i '^nvidia[-_]'; then
            echo "NVIDIA packages are installed: torch must come from the CPU index" >&2
            exit 1
          fi
      # Paths come from [tool.mypy] files: src, scripts and tests.
      - run: mypy --strict

  # Development happens on Windows workstations and on macOS, where text-mode
  # writes, paths and the event loop differ, so the suite runs on all three.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # On Linux, torch first from the PyTorch CPU index, so the local-embeddings extra
      # keeps it and no NVIDIA package is installed; macOS and Windows wheels from PyPI
      # are CPU-only already (C13, Q0029). The suite checks no NVIDIA package is present.
      - name: Install CPU-only torch
        if: runner.os == 'Linux'
        run: pip install "torch>=2.15,<3" --index-url https://download.pytorch.org/whl/cpu
      # Every runtime extra, so each layer's tests run and the licence audit test sees
      # the full install (Q0008). Names come from the package metadata, so a new extra
      # is picked up without editing this file.
      - name: Install with every runtime extra
        shell: bash
        run: |
          pip install -e ".[dev]"
          extras=$(python -c "import importlib.metadata as m; print(','.join(e for e in m.metadata('cognisn-conduit').get_all('Provides-Extra') or [] if e != 'dev'))")
          pip install -e ".[dev,$extras]"
      # The Postgres tests run once, in the postgres job below.
      - run: pytest -ra
        env:
          CONDUIT_POSTGRES_TESTS: skip

  # The sql extra against a real Postgres, started by testcontainers. Ubuntu only:
  # macOS runners have no Docker and Windows runners run Windows containers.
  # CONDUIT_POSTGRES_TESTS=require turns a container that fails to start into a
  # failure, so this job can never pass by skipping.
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,sql]"
      - run: pytest -ra tests/unit/stores/sql tests/conformance/test_sql_stores.py
        env:
          CONDUIT_POSTGRES_TESTS: require

  # Build both distributions, check them, and import the package from the wheel
  # in a clean environment (the version file must ship inside the package).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
      - name: Import the package from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/python" -c "import conduit, importlib.metadata as m; assert conduit.__version__ == m.version('cognisn-conduit'), conduit.__version__; print(conduit.__version__)"

  licences:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Audit exactly what a user installs: the built package, first with no
      # extras, then with every runtime extra (dev is never audited).
      - run: pip install . packaging
      - run: python scripts/licence_audit.py
      # torch first, from the PyTorch CPU index, so the local-embeddings extra keeps it:
      # the default Linux torch would bring NVIDIA CUDA packages, which are never
      # installed or audited (C13).
      - name: Install CPU-only torch
        run: pip install "torch>=2.15,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install every runtime extra
        run: |
          extras=$(python -c "import importlib.metadata as m; print(','.join(e for e in m.metadata('cognisn-conduit').get_all('Provides-Extra') or [] if e != 'dev'))")
          pip install ".[$extras]"
      - name: Refuse any NVIDIA package
        run: |
          if pip list --format=freeze | grep -i '^nvidia[-_]'; then
            echo "NVIDIA packages are installed: torch must come from the CPU index" >&2
            exit 1
          fi
      - run: python scripts/licence_audit.py --all-extras

  # The local-embeddings extra on CPU-only torch (C13): its tests, including the tiny
  # model built on disk (no download), the tripwires and its licence audit. Ubuntu,
  # where torch from PyPI would bring CUDA; macOS and Windows wheels are CPU-only.
  local-embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch, then the extra
        run: |
          pip install "torch>=2.15,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,local-embeddings]"
      - name: Refuse any NVIDIA package
        run: |
          if pip list --format=freeze | grep -i '^nvidia[-_]'; then
            echo "NVIDIA packages are installed: torch must come from the CPU index" >&2
            exit 1
          fi
      # require: a broken torch or sentence-transformers install fails, never skips.
      - run: pytest -ra tests/unit/embeddings tests/tripwires
        env:
          CONDUIT_LOCAL_EMBEDDINGS_TESTS: require
          HF_HUB_OFFLINE: "1"
      - run: python scripts/licence_audit.py --extra local-embeddings
